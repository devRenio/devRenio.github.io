{%- assign recent = site.blog | sort: "date" | reverse -%}

<article
  class="card card--blog"
  id="blog"
  data-card="blog"
  data-blog-card
  data-blog-json="{{ '/assets/data/blog-index.json' | relative_url }}"
>
  <span class="card__glow" aria-hidden="true"></span>

  <header class="card__head">
    <span class="card__icon" aria-hidden="true">
      <svg class="icon"><use href="#i-book" /></svg>
    </span>
    <h2 class="card__title">Blog</h2>
    <button
      type="button"
      class="card__toggle"
      data-card-toggle
      aria-expanded="false"
      aria-controls="blog-detail"
    >
      <span class="card__hint">{{ site.blog.size }}편</span>
      <span class="sr-only">Blog 카드 펼치기</span>
    </button>
    <button type="button" class="card__close" data-card-close>
      <svg class="icon" aria-hidden="true"><use href="#i-x" /></svg>
      <span class="sr-only">카드 접기</span>
    </button>
  </header>

  <div class="card__preview" data-card-content>
    <div class="post-list">
      {%- for post in recent limit: 3 %}
      {%- assign slug = post.url | remove_first: "/blog/posts/" | remove: "/" -%}
      <button
        type="button"
        class="post"
        data-blog-open="{{ slug | escape }}"
      >
        <time class="post__date" datetime="{{ post.date | date_to_xmlschema }}">
          {{ post.date | date: "%y.%m.%d" }}
        </time>
        <span class="post__title">{{ post.title }}</span>
        <span class="post__cat">{{ post.categories | first }}</span>
      </button>
      {%- endfor %}
    </div>
  </div>

  <div class="card__detail" id="blog-detail" data-card-content hidden>
    <div class="blog-panel" data-blog-panel>
      <div class="blog-panel__list" data-blog-list>
        <aside class="blog-nav" data-blog-nav data-stagger>
          <p class="blog-nav__label">Categories</p>
          <div class="blog-nav__head">
            <div class="blog-cat__row">
              <button type="button" class="blog-cat__btn is-active" data-blog-category="">
                <span class="blog-cat__dot" aria-hidden="true"></span>
                <span class="blog-cat__label">전체 글</span>
              </button>
            </div>
          </div>
          {% include blog_category_tree.html nodes=site.data.blog_categories %}
        </aside>

        <div class="blog-browse" data-stagger>
          <div class="blog-search">
            <input
              type="search"
              class="blog-search__input"
              data-blog-search
              placeholder="제목 / 본문 검색…"
              aria-label="포스트 검색"
            />
            <button type="button" class="blog-search__btn" data-blog-search-btn>
              검색
            </button>
          </div>

          <p class="blog-browse__title" data-blog-title>최근 포스트</p>
          <p
            class="blog-browse__empty"
            data-blog-empty
            role="status"
            aria-live="polite"
            hidden
          >
            검색 결과가 없습니다.
          </p>

          <div class="post-list post-list--expanded" data-blog-entries></div>
          <div class="blog-pagination" data-blog-pagination></div>
        </div>
      </div>

      <div class="blog-panel__reader" data-blog-reader hidden>
        <div class="blog-reader__toolbar">
          <button type="button" class="blog-reader__back" data-blog-back>
            <svg class="icon" aria-hidden="true"><use href="#i-arrow-left" /></svg>
            <span>목록으로</span>
          </button>
          <div class="blog-reader__pager" role="group" aria-label="글 이동">
            <button type="button" class="blog-reader__step" data-blog-prev disabled>
              <svg class="icon blog-reader__step-icon blog-reader__step-icon--prev" aria-hidden="true"><use href="#i-chevron" /></svg>
              <span>이전 글</span>
            </button>
            <button type="button" class="blog-reader__step" data-blog-next disabled>
              <span>다음 글</span>
              <svg class="icon blog-reader__step-icon" aria-hidden="true"><use href="#i-chevron" /></svg>
            </button>
          </div>
        </div>
        <div
          class="blog-reader__status"
          data-blog-status
          role="status"
          aria-live="polite"
          hidden
        ></div>
        <div class="blog-reader__scroll" data-blog-scroll>
          <div class="blog-reader__mount" data-blog-mount></div>
        </div>
      </div>
    </div>
  </div>
</article>
