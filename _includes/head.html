<head>
  {% if site.google_analytics %}{% include googeanalytics.html %}{% endif %}

  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>{{ site.data.profile.handle }} &mdash; {{ site.data.profile.name }}</title>
  <meta name="description" content="{{ site.data.profile.tagline }}" />
  <meta name="theme-color" content="#eef2ff" />
  <meta
    name="google-site-verification"
    content="k4p92PduVR_7ZqAlB8-OMnONNOl9GkkmUh4dlKfbY7o"
  />

  <meta property="og:type" content="website" />
  <meta property="og:title" content="{{ site.data.profile.handle }}" />
  <meta property="og:description" content="{{ site.data.profile.tagline }}" />
  <meta property="og:url" content="{{ page.url | absolute_url }}" />
  <meta property="og:image" content="{{ '/assets/images/pp.jpg' | absolute_url }}" />
  <meta name="twitter:card" content="summary" />

  <link rel="canonical" href="{{ page.url | absolute_url }}" />
  <link rel="icon" href="{{ '/assets/images/pp.jpg' | relative_url }}" />

  <link rel="preconnect" href="https://cdn.jsdelivr.net" crossorigin />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link
    rel="stylesheet"
    href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/variable/pretendardvariable-dynamic-subset.min.css"
  />

  <link rel="stylesheet" href="{{ '/assets/css/tokens.css' | relative_url }}" />
  <link rel="stylesheet" href="{{ '/assets/css/base.css' | relative_url }}" />
  <link rel="stylesheet" href="{{ '/assets/css/mesh.css' | relative_url }}" />
  <link rel="stylesheet" href="{{ '/assets/css/splash.css' | relative_url }}" />
  <link rel="stylesheet" href="{{ '/assets/css/bento.css' | relative_url }}" />
  <link rel="stylesheet" href="{{ '/assets/css/cards.css' | relative_url }}" />

  {% feed_meta %}
</head>
