{%- assign p = site.data.profile -%}
<div class="splash" data-splash role="presentation" aria-hidden="true">
  <div class="splash__inner">
    <p class="splash__mark" data-splash-mark>{{ p.handle }}</p>
    <p class="splash__tag" data-splash-tag>{{ p.tagline }}</p>
    <span class="splash__bar" aria-hidden="true"></span>
  </div>
</div>
