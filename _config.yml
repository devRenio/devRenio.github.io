title: devRenio
description: "Eunho Kong"
author: Renio
site_title: "devRenio"
lang: ko-KR
timezone: Asia/Seoul
url: "https://devrenio.github.io"

paginate: 5
paginate_path: "/blog/page:num"
permalink: /blog/:year/:month/:title/

collections:
  blog:
    output: true
    permalink: /blog/:year/:month/:title/

# Build settings
highlighter: none
markdown: kramdown
kramdown:
  input: GFM
include:
  - .nojekyll
  - goorm/_next
  - goorm/_not-found

exclude:
  - vendor/ruby
  - vendor/bundle
  - node_modules
  - Gemfile
  - Gemfile.lock
  - README.md
  - to-do-list.txt
  - test.py

# Personalization
github_username: devRenio
blog_url: ""
email: eunho9684@gmail.com
keybase_username: Renio
twitter_username: Renio
reddit_username: Renio

# absolute or relative
profile_picture: assets/images/pp.jpg

# Google Analytics (unused — dead UA snippet removed)
# google_analytics:

plugins:
  - jekyll-sitemap
  - jekyll-feed
  - jekyll-paginate
